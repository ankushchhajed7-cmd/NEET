<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- background: deep onyx -->
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#2A2B31"/>
      <stop offset=".55" stop-color="#121317"/>
      <stop offset="1" stop-color="#050506"/>
    </radialGradient>
    <!-- mirror gold: hard light/dark bands like polished metal -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF7D1"/>
      <stop offset=".18" stop-color="#F3CF63"/>
      <stop offset=".34" stop-color="#9C6A10"/>
      <stop offset=".47" stop-color="#FFE9A0"/>
      <stop offset=".52" stop-color="#FFFBEA"/>
      <stop offset=".6" stop-color="#D9A93A"/>
      <stop offset=".78" stop-color="#6E4806"/>
      <stop offset=".9" stop-color="#E9C25A"/>
      <stop offset="1" stop-color="#FFF1B8"/>
    </linearGradient>
    <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7D1"/>
      <stop offset=".3" stop-color="#E8BE4E"/>
      <stop offset=".5" stop-color="#8A5C0C"/>
      <stop offset=".56" stop-color="#FFE7A0"/>
      <stop offset=".8" stop-color="#C7922A"/>
      <stop offset="1" stop-color="#FFF0B5"/>
    </linearGradient>
    <!-- mirror silver / chrome -->
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".38" stop-color="#D5DAE2"/>
      <stop offset=".5" stop-color="#5E646F"/>
      <stop offset=".54" stop-color="#2E323A"/>
      <stop offset=".6" stop-color="#C3C9D3"/>
      <stop offset=".82" stop-color="#F4F6FA"/>
      <stop offset="1" stop-color="#9AA1AD"/>
    </linearGradient>
    <linearGradient id="silverD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".3" stop-color="#AEB5C0"/>
      <stop offset=".48" stop-color="#F7F9FC"/>
      <stop offset=".62" stop-color="#5D636D"/>
      <stop offset=".8" stop-color="#E4E8EE"/>
      <stop offset="1" stop-color="#8E95A1"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- full-bleed background (safe for maskable crop) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- outer gold ring + inner silver hairline -->
  <circle cx="256" cy="256" r="178" fill="none" stroke="url(#gold)" stroke-width="20"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#silverD)" stroke-width="3"/>
  <circle cx="256" cy="256" r="193" fill="none" stroke="url(#silverD)" stroke-width="2.5" opacity=".9"/>

  <!-- gold ECG pulse across the ring -->
  <path d="M96 300 H176 L196 300 L212 262 L232 336 L252 238 L270 318 L284 300 H416"
        fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- NEET wordmark in silver chrome with gold edge -->
  <text x="256" y="232" text-anchor="middle"
        font-family="Montserrat, 'Arial Black', Arial, Helvetica, sans-serif" font-weight="900"
        font-size="92" letter-spacing="2"
        fill="url(#silver)" stroke="url(#goldV)" stroke-width="3.5" paint-order="stroke">NEET</text>

  <!-- small gold star of the stethoscope chest-piece -->
  <circle cx="256" cy="372" r="15" fill="url(#gold)"/>
  <circle cx="256" cy="372" r="7" fill="#121317"/>
  <circle cx="256" cy="372" r="3.4" fill="url(#silverD)"/>

  <!-- top polish shine -->
  <ellipse cx="256" cy="150" rx="150" ry="70" fill="url(#shine)"/>
</svg>
